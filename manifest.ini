name="textDrop"
summary="TextDrop"
description="TextDrop is a quick notepad for NVDA. Press a keyboard shortcut to open a simple text box for jotting down or pasting notes on the fly. It shows a live character count and lets you save your text to a file using the standard Windows save dialog."
